<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Architecture of the court-debt (precatório) pipeline</title>
<desc id="desc">The React web app calls the NestJS API over REST with a JWT (1). The API writes each change and its audit-log entry to PostgreSQL in the same transaction (2). An uploaded court PDF goes to the OCR pipeline: pdf-parse first, Tesseract as fallback, then a parser for the federal court, TJSP or TJRJ (3). The extracted fields are stored next to the case (4). A scheduled SLA job finds cases stalled in a stage and creates notifications (5). The API answers the web app, which shows divergences between OCR and the record and the notification bell (6). Validation schemas and the scoring and buyer-matching rules live in a shared package used by both sides. In demo mode the web app swaps HTTP for an in-memory backend with fictitious data, which is what runs on GitHub Pages.</desc>
