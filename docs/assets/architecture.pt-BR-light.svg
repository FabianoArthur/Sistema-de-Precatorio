<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Arquitetura do pipeline de precatórios</title>
<desc id="desc">O app web em React chama a API NestJS por REST com JWT (1). A API grava cada mudança e a entrada do audit log no PostgreSQL na mesma transação (2). O PDF do ofício enviado vai para o pipeline de OCR: pdf-parse primeiro, Tesseract como reserva, depois o parser do TRF, TJSP ou TJRJ (3). Os campos extraídos ficam salvos junto do precatório (4). Um job agendado de SLA acha precatórios parados num estágio e cria notificações (5). A API responde ao app web, que mostra as divergências entre OCR e cadastro e o sino de notificações (6). Os schemas de validação e as regras de score e de match de compradores ficam num pacote compartilhado usado pelos dois lados. No modo demo o app troca o HTTP por um backend em memória com dados fictícios; é o que roda no GitHub Pages.</desc>
