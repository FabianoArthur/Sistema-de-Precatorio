services:
  postgres:
    image: postgres:16-alpine
    container_name: preca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: preca
      POSTGRES_PASSWORD: preca_dev
      POSTGRES_DB: preca_dev
    ports:
      - "5432:5432"
    volumes:
      - preca_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preca -d preca_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  preca_postgres_data:
